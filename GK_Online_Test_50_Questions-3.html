<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GK Online Test - 50 Questions</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:#f3f6fb;margin:0;color:#172033}
.wrap{max-width:850px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}
h1{font-size:25px;margin:4px 0 8px} .sub{color:#536174}
input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5e1;border-radius:10px;font-size:16px}
.q{font-weight:700;font-size:17px;line-height:1.5;margin-bottom:12px}
label{display:block;padding:11px 12px;margin:8px 0;border:1px solid #dbe2ec;border-radius:10px;background:#fafcff}
label:hover{background:#f0f5ff}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
#submit{background:#1d4ed8;color:white;width:100%}
#reset{background:#e8edf5;color:#172033;width:100%;margin-top:10px}
#result{display:none;text-align:center}
.score{font-size:34px;font-weight:800}
.progress{position:sticky;top:0;background:#f3f6fb;padding:8px 0;z-index:2}
.timer{font-weight:800;text-align:right}
.bad{color:#b91c1c} .ok{color:#166534}
.small{font-size:13px;color:#65748a}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📚 GK Online Test — 50 Questions</h1>
    <div class="sub">कक्षा टेस्ट | प्रत्येक प्रश्न 1 अंक | कुल 50 अंक</div>
    <p class="small">नाम भरें, सभी प्रश्नों के उत्तर चुनें और अंत में Submit Test दबाएँ।</p>
    <input id="name" type="text" placeholder="विद्यार्थी का नाम">
    <div class="progress"><div class="timer" id="timer">समय: 30:00</div></div>
  </div>
  <form id="quiz"></form>
  <div class="card">
    <button id="submit" type="button">✅ Submit Test</button>
    <button id="reset" type="button" onclick="location.reload()">↻ फिर से शुरू करें</button>
  </div>
  <div class="card" id="result">
    <h2>Test Result</h2>
    <div id="student"></div>
    <div class="score" id="score"></div>
    <p id="percent"></p>
    <p id="message"></p>
  </div>
</div>
<script>
const questions = [{"q": "संघ लोक सेवा आयोग (UPSC) के अध्यक्ष कौन हैं?", "opts": ["डॉ. अजय कुमार", "ज्ञानेन्द्र कुमार", "अरविंद पनगढ़िया", "किशोर मकवाना"], "ans": 0}, {"q": "भारत के मुख्य चुनाव आयुक्त कौन हैं?", "opts": ["राजीव कुमार", "ज्ञानेन्द्र कुमार", "डॉ. अजय कुमार", "हंसराज अहीर"], "ans": 1}, {"q": "16वें वित्त आयोग के अध्यक्ष कौन हैं?", "opts": ["वी. रामासुब्रमणियन", "एम. जगदीश कुमार", "डॉ. अरविंद पनगढ़िया", "प्रवीण कुमार श्रीवास्तव"], "ans": 2}, {"q": "राष्ट्रीय मानवाधिकार आयोग (NHRC) के अध्यक्ष कौन हैं?", "opts": ["किशोर मकवाना", "विजय किशोर राहटकर", "हंसराज अहीर", "न्यायमूर्ति वी. रामासुब्रमणियन"], "ans": 3}, {"q": "राष्ट्रीय महिला आयोग (NCW) की अध्यक्ष कौन हैं?", "opts": ["विजया किशोर राहटकर", "निर्मला सीतारमण", "स्मृति ईरानी", "सुमन बेरी"], "ans": 0}, {"q": "केंद्रीय सतर्कता आयोग (CVC) के केंद्रीय सतर्कता आयुक्त कौन हैं?", "opts": ["अजय कुमार", "प्रवीण कुमार श्रीवास्तव", "हंसराज अहीर", "ज्ञानेन्द्र कुमार"], "ans": 1}, {"q": "राष्ट्रीय पिछड़ा वर्ग आयोग (NCBC) के अध्यक्ष कौन हैं?", "opts": ["किशोर मकवाना", "साध्वी निरंजन ज्योति", "हंसराज गंगाराम अहीर", "अरविंद पनगढ़िया"], "ans": 1}, {"q": "राष्ट्रीय अनुसूचित जाति आयोग (NCSC) के अध्यक्ष कौन हैं?", "opts": ["हंसराज अहीर", "वी. रामासुब्रमणियन", "अजय कुमार", "किशोर मकवाना"], "ans": 3}, {"q": "UGC के अध्यक्ष (अतिरिक्त प्रभार) कौन हैं?", "opts": ["दीप्ति गौर मुखर्जी", "एम. जगदीश कुमार", "ज्ञानेन्द्र कुमार", "अरविंद पनगढ़िया"], "ans": 0}, {"q": "बांधवगढ़ टाइगर रिजर्व किस जिले में स्थित है?", "opts": ["पन्ना", "उमरिया", "मंडला", "शिवपुरी"], "ans": 1}, {"q": "बांधवगढ़ में 2026 में आयोजित हाथी महोत्सव/पुनर्यौवनीकरण कैंप में कितने हाथियों को शामिल किया गया?", "opts": ["5", "7", "9", "11"], "ans": 2}, {"q": "हाथी महोत्सव का प्रमुख उद्देश्य क्या है?", "opts": ["हाथियों की बिक्री", "हाथियों की देखभाल, स्वास्थ्य और पुनर्जीवन", "पर्यटन बढ़ाना मात्र", "शिकार नियंत्रण"], "ans": 1}, {"q": "कान्हा राष्ट्रीय उद्यान किन जिलों में स्थित है?", "opts": ["उमरिया-कटनी", "मंडला-बालाघाट", "पन्ना-छतरपुर", "शिवपुरी-श्योपुर"], "ans": 1}, {"q": "कान्हा राष्ट्रीय उद्यान किस वन्यजीव के लिए प्रसिद्ध है?", "opts": ["चीता", "बारहसिंगा", "गैंडा", "नीलगाय"], "ans": 1}, {"q": "पेंच राष्ट्रीय उद्यान किन जिलों से संबंधित है?", "opts": ["सिवनी-छिंदवाड़ा", "मंडला-बालाघाट", "पन्ना-छतरपुर", "नर्मदापुरम-बैतूल"], "ans": 0}, {"q": "सतपुड़ा राष्ट्रीय उद्यान किस जिले/क्षेत्र में स्थित है?", "opts": ["उमरिया", "शिवपुरी", "नर्मदापुरम", "श्योपुर"], "ans": 2}, {"q": "कूनो राष्ट्रीय उद्यान किस जिले में है?", "opts": ["भोपाल", "पन्ना", "श्योपुर", "उमरिया"], "ans": 2}, {"q": "कूनो राष्ट्रीय उद्यान किस वन्यजीव के लिए प्रमुख है?", "opts": ["बारहसिंगा", "चीता", "गैंडा", "हाथी"], "ans": 1}, {"q": "माधव राष्ट्रीय उद्यान किस जिले में स्थित है?", "opts": ["शिवपुरी", "सिवनी", "मंडला", "पन्ना"], "ans": 0}, {"q": "वन विहार राष्ट्रीय उद्यान किस शहर में स्थित है?", "opts": ["इंदौर", "ग्वालियर", "जबलपुर", "भोपाल"], "ans": 3}, {"q": "पन्ना राष्ट्रीय उद्यान मुख्य रूप से किस वन्यजीव के लिए प्रसिद्ध है?", "opts": ["बाघ", "चीता", "बारहसिंगा", "सिंह"], "ans": 0}, {"q": "भारत में बच्चों के यौन अपराधों से सुरक्षा के लिए POCSO Act किस वर्ष बना?", "opts": ["2010", "2012", "2014", "2016"], "ans": 1}, {"q": "POCSO का पूरा नाम क्या है?", "opts": ["Protection of Children from Sexual Offences Act", "Prevention of Children from Social Offences Act", "Protection of Citizens from Sexual Offences Act", "Prevention of Child Safety Act"], "ans": 0}, {"q": "POCSO Act के अनुसार बच्चा किस आयु से कम व्यक्ति को माना जाता है?", "opts": ["14 वर्ष", "16 वर्ष", "18 वर्ष", "21 वर्ष"], "ans": 2}, {"q": "संविधान का अनुच्छेद 21A किससे संबंधित है?", "opts": ["समानता का अधिकार", "शिक्षा का अधिकार", "धार्मिक स्वतंत्रता", "संपत्ति का अधिकार"], "ans": 1}, {"q": "अनुच्छेद 24 किससे संबंधित है?", "opts": ["बाल श्रम पर रोक", "शिक्षा का अधिकार", "मतदान का अधिकार", "धार्मिक स्वतंत्रता"], "ans": 0}, {"q": "महिलाओं और बच्चों के लिए विशेष प्रावधान बनाने की अनुमति किस अनुच्छेद में है?", "opts": ["अनुच्छेद 14", "अनुच्छेद 15(3)", "अनुच्छेद 19", "अनुच्छेद 24"], "ans": 1}, {"q": "बच्चों के स्वस्थ विकास और शोषण से सुरक्षा का उल्लेख किस अनुच्छेद में है?", "opts": ["अनुच्छेद 32", "अनुच्छेद 39(f)", "अनुच्छेद 44", "अनुच्छेद 51A"], "ans": 1}, {"q": "बच्चों के स्वास्थ्य और शक्ति के दुरुपयोग को रोकने से संबंधित अनुच्छेद कौन-सा है?", "opts": ["39(e)", "40", "45", "48"], "ans": 0}, {"q": "अनुच्छेद 21 किससे संबंधित है?", "opts": ["जीवन और व्यक्तिगत स्वतंत्रता", "शिक्षा", "चुनाव", "पंचायत"], "ans": 0}, {"q": "कोटक महिंद्रा बैंक के नए MD & CEO कौन होंगे?", "opts": ["अशोक वासवानी", "अनूप कुमार साहा", "अतुल कुमार गोयल", "रजनीश कर्नाटक"], "ans": 1}, {"q": "अनूप कुमार साहा कोटक महिंद्रा बैंक के MD & CEO का पद कब संभालेंगे?", "opts": ["1 अक्टूबर 2026", "31 दिसंबर 2026", "1 जनवरी 2027", "1 अप्रैल 2027"], "ans": 2}, {"q": "अनूप कुमार साहा का कार्यकाल कितने वर्षों का है?", "opts": ["2 वर्ष", "3 वर्ष", "4 वर्ष", "5 वर्ष"], "ans": 1}, {"q": "अनूप कुमार साहा किसका स्थान लेंगे?", "opts": ["अतुल कुमार गोयल", "शशिधर जगदीशन", "अशोक वासवानी", "चंद्र श्रीनिवासुलु सेट्टी"], "ans": 2}, {"q": "SBI के अध्यक्ष कौन हैं?", "opts": ["दिनेश खारा", "चल्ला श्रीनिवासुलु सेट्टी", "अतुल कुमार गोयल", "रजनीश कर्नाटक"], "ans": 1}, {"q": "बैंक ऑफ बंगाल की स्थापना कब हुई थी?", "opts": ["1806", "1840", "1843", "1921"], "ans": 0}, {"q": "बैंक ऑफ बॉम्बे की स्थापना कब हुई थी?", "opts": ["1806", "1840", "1843", "1921"], "ans": 2}, {"q": "तीनों Presidency Banks का विलय कब हुआ?", "opts": ["1919", "1921", "1935", "1949"], "ans": 1}, {"q": "RBI की स्थापना कब हुई थी?", "opts": ["1921", "1935", "1947", "1949"], "ans": 1}, {"q": "Imperial Bank of India को SBI में कब बदला गया?", "opts": ["1949", "1950", "1955", "1969"], "ans": 2}, {"q": "1969 में कितने प्रमुख बैंकों का राष्ट्रीयकरण हुआ था?", "opts": ["6", "10", "14", "20"], "ans": 2}, {"q": "1980 में कितने और बैंकों का राष्ट्रीयकरण हुआ?", "opts": ["4", "6", "8", "10"], "ans": 1}, {"q": "शुभमन गिल ने सबसे तेज ODI दोहरा शतक कितनी गेंदों में पूरा किया?", "opts": ["117", "126", "128", "133"], "ans": 0}, {"q": "शुभमन गिल ने वेस्टइंडीज के खिलाफ कितने रन बनाए?", "opts": ["201", "210", "223", "226"], "ans": 2}, {"q": "शुभमन गिल ने सबसे तेज ODI दोहरे शतक का किसका रिकॉर्ड तोड़ा?", "opts": ["रोहित शर्मा", "विराट कोहली", "ग्लेन मैक्सवेल", "ईशान किशन"], "ans": 3}, {"q": "ODI में दो दोहरे शतक लगाने वाले शुभमन गिल दूसरे बल्लेबाज बने। उनसे पहले कौन थे?", "opts": ["विराट कोहली", "रोहित शर्मा", "सचिन तेंदुलकर", "ईशान किशन"], "ans": 1}, {"q": "भारत ने पहला ODI World Cup कब जीता था?", "opts": ["1975", "1983", "1987", "2011"], "ans": 1}, {"q": "1983 ODI World Cup में भारत के कप्तान कौन थे?", "opts": ["सुनील गावस्कर", "कपिल देव", "मोहम्मद अजहरुद्दीन", "रवि शास्त्री"], "ans": 1}, {"q": "भारत ने पहला T20 World Cup कब जीता?", "opts": ["2005", "2007", "2011", "2014"], "ans": 1}, {"q": "2024 T20 World Cup के फाइनल में भारत ने किस टीम को हराया?", "opts": ["ऑस्ट्रेलिया", "इंग्लैंड", "दक्षिण अफ्रीका", "न्यूज़ीलैंड"], "ans": 2}];
const quiz = document.getElementById('quiz');

questions.forEach((item,i)=>{
  const card=document.createElement('div');
  card.className='card';
  let opts='';
  item.opts.forEach((o,j)=>{
    opts += `<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}) ${o}</label>`;
  });
  card.innerHTML=`<div class="q">${i+1}. ${item.q}</div>${opts}`;
  quiz.appendChild(card);
});

let seconds=30*60, submitted=false;
const timerEl=document.getElementById('timer');
const timer=setInterval(()=>{
  if(submitted) return;
  const m=Math.floor(seconds/60), s=seconds%60;
  timerEl.textContent=`समय: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(seconds<=0) submitTest(true);
  seconds--;
},1000);

function submitTest(auto=false){
  if(submitted) return;
  submitted=true; clearInterval(timer);
  const name=document.getElementById('name').value.trim() || 'विद्यार्थी';
  let score=0, attempted=0;
  questions.forEach((item,i)=>{
    const picked=document.querySelector(`input[name="q${i}"]:checked`);
    if(picked){attempted++; if(Number(picked.value)===item.ans) score++;}
  });
  const pct=(score/questions.length*100).toFixed(0);
  document.getElementById('student').textContent=`नाम: ${name}`;
  document.getElementById('score').textContent=`${score} / ${questions.length}`;
  document.getElementById('percent').textContent=`प्रतिशत: ${pct}% | Attempted: ${attempted}/${questions.length}`;
  document.getElementById('message').textContent=auto ? 'समय समाप्त होने पर टेस्ट अपने-आप जमा हुआ।' : 'टेस्ट सफलतापूर्वक जमा हो गया।';
  document.getElementById('result').style.display='block';
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  document.querySelectorAll('input').forEach(x=>x.disabled=true);
  document.getElementById('submit').disabled=true;
}
document.getElementById('submit').addEventListener('click',()=>{
  if(confirm('क्या आप टेस्ट जमा करना चाहते हैं?')) submitTest(false);
});
</script>
</body>
</html>
